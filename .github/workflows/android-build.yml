name: Build Android Release (AAB & APK)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code (integer, increment on every Play Store upload)'
        required: false
        default: '1'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    if: github.repository == 'MaryamJaberi/Dour-new'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run tests & build web bundle
        run: |
          npm test
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode Android Keystore (if configured in GitHub Secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Android App Bundle (.aab) and Debug APK
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dour-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dour-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
